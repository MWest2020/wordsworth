<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}wordsworth{% endblock %}</title>
<link rel="stylesheet" href="/console/static/fonts.css">
<style>
/* Hetzelfde ontwerp als de publieke demo (wordsworth-demo-site): dezelfde
   variabelen, dezelfde families, dezelfde tokenchips. De lettertypen staan hier
   zelf — een soevereiniteitsdemo die zijn letters bij Google ophaalt, weerlegt
   zichzelf in de netwerkinspector. */
:root{
  --ground:#F4F6F9; --surface:#FFFFFF; --surface-2:#EEF1F6;
  --ink:#15191F; --muted:#596373; --faint:#8A93A2; --line:#DCE1EA;
  --indigo:#33406B; --indigo-soft:#5A6796;
  --token-bg:#E7EBF2; --token-ink:#5A6474;
  --brass:#A9781E; --brass-deep:#835A12;
  --reveal-bg:#F8EFD8; --reveal-ink:#6E4E13; --reveal-line:#E3CE97;
  --revoked:#A23A34;
  --shadow:0 1px 2px rgba(20,25,35,.05), 0 8px 28px -18px rgba(20,25,35,.28);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1016; --surface:#161B23; --surface-2:#1C222C;
    --ink:#E7EAF0; --muted:#98A2B2; --faint:#6C7686; --line:#28303C;
    --indigo:#8493CE; --indigo-soft:#69769F;
    --token-bg:#1F2732; --token-ink:#9AA6B6;
    --brass:#D8A845; --brass-deep:#E9C77A;
    --reveal-bg:#2B2413; --reveal-ink:#EBCB80; --reveal-line:#5A4A22;
    --revoked:#E08A82;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px -20px rgba(0,0,0,.75);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"Public Sans", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased}
.wrap{max-width:1040px; margin:0 auto; padding:clamp(20px,4vw,44px) clamp(18px,4vw,32px)}
a{color:var(--indigo)} a:hover{color:var(--brass-deep)}
code{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.86em}

.eyebrow{font-size:.74rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--brass-deep); font-weight:700; margin:0 0 10px}
h1{font-family:"Spectral", Georgia, serif; font-weight:600;
  font-size:clamp(1.7rem,4vw,2.4rem); line-height:1.1; letter-spacing:-.01em; margin:0 0 .3em}
h2{font-family:"Spectral", Georgia, serif; font-weight:600; font-size:1.3rem; margin:28px 0 8px}
.lede{color:var(--muted); max-width:66ch; margin:0 0 4px}

/* kop */
.topbar{border-bottom:1px solid var(--line); background:var(--surface)}
.topbar .wrap{display:flex; align-items:baseline; gap:20px; padding-top:14px; padding-bottom:14px}
.brand{font-family:"Spectral",Georgia,serif; font-weight:600; font-size:1.05rem; letter-spacing:-.01em}
.brand .mark{color:var(--brass)}
.topbar nav{display:flex; gap:4px; margin-left:8px}
.topbar nav a{font-weight:600; font-size:.9rem; color:var(--muted); text-decoration:none;
  padding:6px 11px; border-radius:8px}
.topbar nav a:hover{color:var(--ink); background:var(--surface-2)}
.topbar nav a[aria-current="page"]{color:var(--ink); box-shadow:inset 0 -2px 0 var(--brass)}
.who{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--faint)}
.who a{color:var(--faint); text-decoration:none} .who a:hover{color:var(--brass-deep)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow)}
.card.pad{padding:16px 18px}
.panel-head{display:flex; align-items:center; gap:8px; padding:12px 16px;
  border-bottom:1px solid var(--line); background:var(--surface-2);
  border-radius:var(--radius) var(--radius) 0 0}
.panel-head .dot{width:9px;height:9px;border-radius:50%;background:var(--indigo-soft);opacity:.5}
.panel-head h3{margin:0; font-size:.8rem; font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; color:var(--muted)}
.panel-head .badge{margin-left:auto; font-family:"IBM Plex Mono",monospace;
  font-size:.68rem; color:var(--faint)}

table{border-collapse:collapse; width:100%; font-size:.92rem}
thead th{font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--faint); text-align:left; padding:10px 16px; border-bottom:1px solid var(--line)}
tbody td{padding:11px 16px; border-bottom:1px solid var(--line); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td a{font-weight:600; text-decoration:none}

.tok{font-family:"IBM Plex Mono",monospace; font-size:.8rem; background:var(--token-bg);
  color:var(--token-ink); border:1px solid transparent; border-radius:5px; padding:1px 5px;
  transition:background .25s, color .25s, border-color .25s}
@media (prefers-reduced-motion:reduce){.tok{transition:none}}
.tok.revealed{background:var(--reveal-bg); color:var(--reveal-ink);
  border-color:var(--reveal-line); font-weight:500}
label.pill{display:inline-flex; align-items:center; gap:5px}
label.pill input{margin:0}
[hidden]{display:none!important}
.doc{font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:.83rem; line-height:1.95;
  padding:18px 20px 22px; white-space:pre-wrap; word-break:break-word; margin:0}
.pill{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:.7rem;
  background:var(--surface-2); color:var(--muted); border:1px solid var(--line);
  border-radius:999px; padding:2px 9px; margin:0 4px 4px 0}
.pill b{color:var(--ink); font-weight:600}
.state{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--muted)}
.note{color:var(--faint); font-size:.84rem; max-width:72ch}
.fout{background:var(--reveal-bg); color:var(--reveal-ink); border:1px solid var(--reveal-line);
  border-left:3px solid var(--revoked); padding:11px 14px; border-radius:10px; font-size:.9rem}
.empty{color:var(--faint); font-style:italic; padding:14px 16px; font-size:.88rem}

label{display:block; font-size:.8rem; font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; color:var(--muted); margin-bottom:6px}
input[type=text],input[type=password],textarea{width:100%; font:inherit; font-size:.95rem;
  padding:11px 14px; border:1px solid var(--line); border-radius:10px;
  background:var(--surface); color:var(--ink)}
textarea{min-height:5rem; resize:vertical; line-height:1.5}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass); outline-offset:1px;
  border-color:var(--brass)}
.btn{font:inherit; font-weight:600; font-size:.95rem; padding:11px 20px; border-radius:10px;
  cursor:pointer; border:1px solid transparent; background:var(--indigo); color:#fff;
  box-shadow:var(--shadow)}
.btn:hover{background:var(--indigo-soft)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
.field{margin-bottom:14px}
.sovereign{border-left:3px solid var(--brass); padding:14px 18px; margin-top:26px}
</style></head><body>
{% block chrome %}
<header class="topbar"><div class="wrap">
  <span class="brand">words<span class="mark">worth</span></span>
  <nav>
    <a href="/console" {% if page == 'documents' %}aria-current="page"{% endif %}>documenten</a>
    <a href="/console/search" {% if page == 'search' %}aria-current="page"{% endif %}>zoeken</a>
    <a href="/console/topics" {% if page == 'topics' %}aria-current="page"{% endif %}>onderwerpen</a>
    <a href="/console/feedback" {% if page == 'feedback' %}aria-current="page"{% endif %}>meldingen</a>
    <a href="/console/roles" {% if page == 'roles' %}aria-current="page"{% endif %}>rollen</a>
    <a href="/console/combinations" {% if page == 'combinations' %}aria-current="page"{% endif %}>combinaties</a>
  </nav>
  <span class="who">{% block who %}{% endblock %} · <a href="/console/logout">afmelden</a></span>
</div></header>
{% endblock %}
<main class="wrap">{% block body %}{% endblock %}</main>
</body></html>

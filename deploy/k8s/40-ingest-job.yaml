# Run the full straat over a PDF corpus: ingest → OCR recovery → anonymize
# (OpenAnonymiser GLiNER) → store (S3) → index (OpenSearch + Ollama bge-m3).
#
# TEMPLATE — a batch Job you run per corpus. Provide the corpus at /corpus: the
# example uses a PVC; adjust to how the corpus lands on alma (PVC, hostPath, or
# an initContainer that pulls it). Requires the init Job to have run first and
# the OpenAnonymiser service to be reachable (fail-hard if it is down).
#   kubectl -n wordsworth apply -f 40-ingest-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: wordsworth-ingest
  namespace: wordsworth
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: wordsworth, job: ingest }
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ingest
          # Pin op DIGEST, niet op een tag. Een tag kan verplaatst worden — ook
          # `sha-<commit>`, want die is herpublicabel — en dan is "welke code
          # heeft dit document gezien" niet meer te beantwoorden. Bij een
          # systeem dat persoonsgegevens verwerkt is dat geen nieuwsgierigheid
          # maar een auditvraag. `scripts/pin_check.py` bewaakt het.
          image: ghcr.io/mwest2020/wordsworth@sha256:<digest>
          imagePullPolicy: IfNotPresent
          command: ["wordsworth-ingest", "--corpus-dir", "/corpus"]
          envFrom:
            # DE SECRETNAMEN MOETEN MATCHEN MET JE EIGEN UITROL. 10-config.yaml
            # hierboven is een template met één gecombineerde `wordsworth-secrets`;
            # de echte uitrol (MWest2020/homelab, cluster-config/infra/wordsworth)
            # splitst hem in vier. Draai je deze Job met de verkeerde naam, dan
            # blijft de pod hangen in CreateContainerConfigError — en dat is een
            # toestand waarin `kubectl logs` NIETS teruggeeft, dus je ziet niet
            # waaróm. Gemeten 2026-09-13: zes minuten zoeken in `describe` voor
            # één regel "secret not found".
            - configMapRef: { name: wordsworth-config }
            - secretRef: { name: wordsworth-db }        # WORDSWORTH_DATABASE_URL
            - secretRef: { name: wordsworth-s3 }        # S3-sleutels
            - secretRef: { name: wordsworth-openbao }   # WORDSWORTH_OPENBAO_TOKEN
            - secretRef: { name: wordsworth-apikeys }   # WORDSWORTH_API_KEYS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: corpus, mountPath: /corpus, readOnly: true }
            - { name: tmp, mountPath: /tmp }   # ocrmypdf writes temp files here
          resources:
            # Ruimer dan de api: OCR-recovery (ocrmypdf + tesseract) op een
            # gescande pagina is geheugenhongerig, en een corpus van echte
            # Woo-documenten zit vol scans. Gemeten op 200 documenten.
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "2000m", memory: "3Gi" }
      volumes:
        - name: corpus
          persistentVolumeClaim:
            claimName: wordsworth-corpus   # zie 50-corpus.yaml (PVC + loader-pod)
        - name: tmp
          emptyDir: {}

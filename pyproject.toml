[project]
name = "wordsworth"
version = "0.1.0"
description = "Sovereign pipeline turning government documents into a searchable, privacy-safe corpus"
readme = "README.md"
authors = [
    { name = "MWest2020", email = "mwest2020@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.44",
    "cryptography>=50.0.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "ocrmypdf>=17.8.0",
    "opensearch-py>=3.2.0",
    "psycopg[binary]>=3",
    "pydantic>=2",
    "python-multipart>=0.0.18",
    "pypdf>=6.21.4",  # 6.21.4: HIGH DoS CVE-2026-119203; 6.19.0: CVE-2026-115572, -115580, -115585
    # pdf-redaction: pypdfium2 (confirmed via package metadata: "BSD-3-Clause,
    # Apache-2.0, dependency licenses" -- its own code dual BSD-3-Clause/
    # Apache-2.0, bundling Google's PDFium under the same) gives the
    # positioned text + rasterisation the box map and the redacted render
    # need; reportlab (confirmed: "BSD license") rebuilds the output PDF --
    # both MIT-compatible (CLAUDE.md), so moved here from the dev group
    # rather than left a dev-only dependency.
    "pypdfium2>=5.11.0",
    "reportlab>=5.0.0",
    # Agglomeratieve clustering voor onderwerpen. Kwam tot nu toe mee via zeef;
    # rechtstreeks gebruiken betekent zelf verklaren, anders verdwijnt hij bij
    # de eerste keer dat zeef iets anders kiest.
    "scipy>=1.11",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.30",
    "gunicorn>=23.0",
    "zeef",
    "spacy>=3.8",
    # Pinned by version, direct URL: `uv.lock` then records its hash and the
    # cluster pulls nothing at runtime. CC BY-SA 4.0 (attribution in NOTICE),
    # used unchanged -- see topics.py and docs/how-to/topics.md.
    "nl-core-news-sm",
]

[project.scripts]
wordsworth = "wordsworth.client:main"
wordsworthctl = "wordsworth.client:main"
wordsworth-init = "wordsworth.bootstrap:main"
wordsworth-backfill-pseudonyms = "wordsworth.backfill_pseudonyms:main"
wordsworth-backfill-filenames = "wordsworth.backfill_filenames:main"
wordsworth-backfill-dossier = "wordsworth.backfill_dossier:main"
wordsworth-access-preflight = "wordsworth.access_preflight:main"
wordsworth-dossier-uit-herkomst = "wordsworth.dossier_tools:main_assign"
wordsworth-dossier-hernoem = "wordsworth.dossier_tools:main_rename"
wordsworth-dedupe = "wordsworth.dedupe:main"
wordsworth-backfill-passages = "wordsworth.backfill_passages:main"
wordsworth-ingest = "wordsworth.ingest_corpus:main"
wordsworth-measure-combinations = "wordsworth.measure_combinations:main"
wordsworth-delete = "wordsworth.delete_cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
# Er stond geen linter, en dus vielen een ongebruikte import en een dode functie
# niet op -- de codereview vond ze met de hand. Bewust smal: alleen wat
# aantoonbaar fout is, geen stijlvoorkeuren, want een linter die over smaak
# klaagt wordt uitgezet.
line-length = 100

[tool.ruff.lint]
select = ["F", "E9"]   # echte fouten en syntaxfouten, geen stijl

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
zeef = { git = "https://github.com/MWest2020/zeef" }
nl-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/nl_core_news_sm-3.8.0/nl_core_news_sm-3.8.0-py3-none-any.whl" }
# Architecture A: OpenAnonymiser is reached over HTTP (a deployed service), not
# imported in-process — so no torch/spaCy/presidio/GLiNER pulled into Wordsworth.
# The service URL is WORDSWORTH_OPENANONYMISER_URL (see config.py).

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Roadmap, as data. Drafted 2026-10-30 by the odin coding session from this
# repository's own docs and merged work, for the overview at westerweel.work/nu/.
# Mark reviews and corrects it; until then it is a proposal. An item is "done"
# only with evidence (a PR, issue or doc); everything else is "open".
# Schema: project, goal, current (a phase id), phases [id, name, summary], and
# done_means for the current phase [item, status done|open, evidence].
project: wordsworth
goal: "A sovereign pipeline that turns large volumes of Dutch government documents into a searchable, privacy-safe corpus with layered, audited de-anonymisation."
current: pilot
phases:
  - {id: poc, name: "Proof of concept", summary: "ingest, anonymise, search, reversible tokens with grants, the console"}
  - {id: pilot, name: "Pilot: Gooise Meren", summary: "one real Woo publication (415 documents) end to end, for a key user"}
  - id: data-autonomy
    name: "Data autonomy"
    summary: "the organisation holds the keys: originals encrypted, rights per group, a separate key service, keys exportable (ADR-0008, ADR-0009)"
    # The next phase's done-means, open until built and verified (the overview
    # shows done_means for the current phase only).
    done_means:
      - {item: "Sealed-original format and wrapped key store", status: done, evidence: "https://github.com/MWest2020/wordsworth/pull/335"}
      - {item: "A deleted document releases its object key (same bytes can be ingested again)", status: done, evidence: "https://github.com/MWest2020/wordsworth/pull/341"}
      - {item: "New originals are sealed at rest under a per-document key, and every reader opens them through the seam (in production since 2026-11-09; verified 2026-11-10 with a synthetic document)", status: done, evidence: "https://github.com/MWest2020/wordsworth/issues/379#issuecomment-6761871781"}
      - {item: "OCR-recovered originals stored encrypted, never over another document (in production since 2026-11-11)", status: done, evidence: "https://github.com/MWest2020/wordsworth/pull/411"}
      - {item: "Deleting a document destroys its key (crypto-shredding): merged (#450, decisions #428 and #429 as built) and in production since 2026-11-14 (homelab#58); no older deletion still held a key", status: done, evidence: "https://github.com/MWest2020/homelab/pull/58"}
      - {item: "Deleting an OCR-recovered document also removes its original scan (#454): merged (#476), in production since 2026-11-14 (homelab#60); the rerun removed the 6 plaintext scans left in the store", status: done, evidence: "https://github.com/MWest2020/wordsworth/issues/454"}
      - {item: "The existing corpus sealed and verified (2026-11-16): fresh backups first, 3 documents then all; 412 sealed, 4 already sealed, 0 failed; verify passes, no sealed orphans, a rerun finds only already sealed (#497)", status: done, evidence: "https://github.com/MWest2020/wordsworth/issues/497#issuecomment-6926850925"}
      - {item: "Rights per Keycloak group, managed as data: built on the default of #495 (a group role never authorises a reveal; #495 still open) in #519, in production since 2026-11-17 (homelab 8e27113)", status: done, evidence: "https://github.com/MWest2020/wordsworth/pull/519"}
      - {item: "A separate key-and-reveal service with its own database", status: open, evidence: "https://github.com/MWest2020/wordsworth/tree/main/openspec/changes/key-service-skeleton"}
      - {item: "wordsworth cut over to the key service, verified", status: open, evidence: "https://github.com/MWest2020/wordsworth/tree/main/openspec/changes/key-service-cutover"}
      - {item: "Search on a real value via the key service, no values in the index", status: open, evidence: "https://github.com/MWest2020/wordsworth/tree/main/openspec/changes/search-by-value"}
      - {item: "Keys exportable only wrapped (escrow, moving away)", status: open, evidence: "https://github.com/MWest2020/wordsworth/tree/main/openspec/changes/key-export-escrow"}
  - {id: production, name: "Production", summary: "survives a node, NORA-aligned, ready for a first organisation"}
done_means:
  - {item: "Pilot report filled in, ranking gate passed", status: done, evidence: "https://github.com/MWest2020/wordsworth/pull/284"}
  - {item: "PII read on a sample of the anonymised output", status: done, evidence: "https://github.com/MWest2020/wordsworth/pull/284"}
  - {item: "No untokenised names left (names with particles like ter, van der): the reprocess with a count-only check is built (#449) and deployed (homelab#58); the run over the dossier is next", status: open, evidence: "https://github.com/MWest2020/wordsworth/pull/449"}
  - {item: "A redacted PDF for every reversible document in the dossier", status: open, evidence: "https://github.com/MWest2020/wordsworth/issues/259"}
  - {item: "Console for the key user: deleted documents hidden, a dossier home (built in #426, in production since 2026-11-14 with homelab#58)", status: done, evidence: "https://github.com/MWest2020/homelab/pull/58"}
  - {item: "Readable topics (named by the language model) and search that shows the matching passage (built in #433 and #432, in production since 2026-11-14 with homelab#58; label quality judged at the rehearsal)", status: open, evidence: "https://github.com/MWest2020/wordsworth/pull/433"}
  - {item: "Share from the console with layered anonymisation: proposals #439/#440 merged, PDF views built (#436); Mark decided the design (#416, #417, #444, defaults, 2026-11-14) and the read-gate proposal is merged (#446); the read gate is merged (#485); reveal now checks the grant first (#518 on the default of #487, in production since 2026-11-17, homelab d30c4fe); the share build is next", status: open, evidence: "https://github.com/MWest2020/wordsworth/pull/440"}
  - {item: "Only corpus readers reach the corpus over the API and the console: every route has a recorded check, and a logged-in caller on no read list is refused (the deploy gate for sharing): merged (#485) and deployed with an empty list (homelab#63, behaviour unchanged); the rollout (tasks 6.1-6.4) is next", status: open, evidence: "https://github.com/MWest2020/wordsworth/pull/485"}
  - {item: "Documents survive a node (storage on two nodes, proven)", status: done, evidence: "https://github.com/MWest2020/wordsworth/issues/193#issuecomment-6714219091"}
  - {item: "The tailnet ingress runs on two nodes and survives losing one proxy", status: done, evidence: "https://github.com/MWest2020/wordsworth/issues/192"}

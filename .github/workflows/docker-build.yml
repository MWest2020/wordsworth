# SPDX-License-Identifier: EUPL-1.2
# Build + push the Wordsworth image to GHCR (factory). Gate: a fast offline test
# run, then build deploy/Dockerfile, Trivy-scan the built image (HIGH/CRITICAL),
# and push on main. The full integration suite runs separately in ci.yml.
# GHCR auth uses the built-in GITHUB_TOKEN — no Docker-Hub secret needed.
name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    # Build (no push) on PRs so Dockerfile/dep changes are validated pre-merge.
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build (e.g. main, v1.2.0)'
        required: true
        default: 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mwest2020/wordsworth

jobs:
  test:
    name: Fast test gate (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.15"

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      # No service containers here: the DB/OpenSearch/S3 integration tests skip,
      # leaving the fast unit suite as a pre-build sanity gate.
      - name: Run tests
        run: uv run pytest -q

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write   # push to GHCR with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Determine tags
        id: meta
        run: |
          REF="${{ github.event.inputs.ref }}"
          if [[ -z "$REF" ]]; then
            REF="${GITHUB_REF#refs/heads/}"
          fi
          SHORT="${GITHUB_SHA::7}"
          if [[ "$REF" == "main" ]]; then
            TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:main,${IMAGE_NAME}:sha-${SHORT}"
          elif [[ "$REF" == v* ]]; then
            TAGS="${IMAGE_NAME}:${REF},${IMAGE_NAME}:latest"
          else
            TAGS="${IMAGE_NAME}:${REF//\//-}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "📦 tags: ${TAGS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build to the runner first (load, no push) so Trivy scans the exact image
      # before it can reach the registry.
      - name: Build image (load to runner for scan)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: scan-target:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          vuln-type: os,library

      # Second build is instant from the GHA cache above.
      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - name: Pushed summary
        if: github.event_name != 'pull_request'
        run: |
          echo "🚀 **Pushed to GHCR:**" >> "$GITHUB_STEP_SUMMARY"
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAG_ARRAY[@]}"; do
            echo "- \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done
